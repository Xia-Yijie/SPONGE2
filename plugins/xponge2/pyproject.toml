[project]
name = "xponge2"
version = "2.0.0-beta.1"
description = "Python API and wheel packaging for SPONGE/xponge"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "SPONGE Developers"}]
keywords = ["SPONGE", "Xponge", "molecular dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "tomlkit>=0.13",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
exclude = ["build*", "dist*", "*.egg-info*"]

[tool.setuptools.package-data]
xponge2 = ["py.typed", "*.pyi", "_core*.so", "_core*.pyd", "_core*.dll"]
"xponge2.io" = ["*.pyi"]
"xponge2.forcefield" = ["*.pyi"]
"xponge2.forcefield.amber" = ["*.pyi", "files/*.txt"]
"xponge2.forcefield.amber.parmchk2" = ["*.pyi", "data/*.DAT", "data/*.TPL", "data/*.dat"]
